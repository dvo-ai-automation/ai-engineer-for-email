<!doctype html><html lang="nl"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  background:#1a1c4e;
  color:#fff;
  -webkit-font-smoothing:antialiased;
}
.bg{position:absolute;inset:0;
  background:
    radial-gradient(115% 95% at 4% -12%, #4b3fc4 0%, rgba(75,63,196,0) 62%),
    radial-gradient(90% 80% at 100% 108%, #2a2470 0%, rgba(42,36,112,0) 60%),
    linear-gradient(140deg,#232566 0%,#181a4b 55%,#141637 100%);
}
.pad{position:absolute;inset:0;padding:64px 72px 56px}
.eyebrow{display:flex;align-items:center;gap:14px;
  font-size:17px;font-weight:700;letter-spacing:.20em;text-transform:uppercase;color:#a7abe0}
.dot{width:15px;height:15px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 5px rgba(34,197,94,.16)}
h1{margin-top:38px;font-size:78px;line-height:1.03;font-weight:800;letter-spacing:-.028em}
h1 .acc{color:#7d80f2}
.sub{margin-top:30px;font-size:23px;line-height:1.5;color:#b9bdea;font-weight:400}
.sub b{color:#fff;font-weight:700}
.bars{position:absolute;left:72px;right:72px;bottom:126px;display:grid;grid-template-columns:repeat(4,1fr);gap:26px}
.bar .track{height:9px;border-radius:99px;background:rgba(255,255,255,.13);overflow:hidden}
.bar .fill{height:100%;border-radius:99px;background:#7d80f2}
.bar .lbl{font-size:18px;font-weight:700;color:#9ea2d8;border-top:2px solid #7d80f2;padding-top:15px}
.bar.on .lbl{color:#fff}
.rule{position:absolute;left:72px;right:72px;bottom:96px;height:1px;background:rgba(255,255,255,.14)}
.foot{position:absolute;left:72px;right:72px;bottom:52px;display:flex;justify-content:space-between;align-items:baseline}
.url{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:22px;color:#e6e7fb;letter-spacing:-.01em}
.who{font-size:22px;font-weight:700;color:#a7abe0}
</style></head><body>
<div class="bg"></div>
<div class="pad">
  <div class="eyebrow"><span class="dot"></span>Werkoverzicht</div>
  <h1>Tools voor e-mailmarketing<br><span class="acc">en CRM-automatisering</span></h1>
  <div class="sub">Structured outputs, retrieval, agents en evals.<br>
  Publieke, eigen of synthetische data — <b>geen klantdata</b>.</div>
</div>
<div class="bars">
  <div class="bar on"><div class="lbl">Structured outputs</div></div>
  <div class="bar on"><div class="lbl">Retrieval</div></div>
  <div class="bar on"><div class="lbl">Agents</div></div>
  <div class="bar on"><div class="lbl">Evals</div></div>
</div>
<div class="rule"></div>
<div class="foot">
  <span class="url">github.com/dvo-ai-automation</span>
  <span class="who">Dylan van Olderen</span>
</div>
</body></html>
